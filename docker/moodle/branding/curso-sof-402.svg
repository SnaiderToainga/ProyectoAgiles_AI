<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" preserveAspectRatio="xMidYMid slice">
  <title>Estructuras de Datos</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E1014"/>
      <stop offset="1" stop-color="#A8242B"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" fill="url(#fondo)"/>
  <circle cx="880" cy="260" r="130" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="70" cy="30" r="90" fill="#FFFFFF" opacity="0.05"/>
  <!-- Árbol binario -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="330" y1="70" x2="260" y2="150"/>
    <line x1="330" y1="70" x2="400" y2="150"/>
    <line x1="260" y1="150" x2="220" y2="230"/>
    <line x1="260" y1="150" x2="300" y2="230"/>
    <line x1="400" y1="150" x2="440" y2="230"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="330" cy="70" r="24"/>
    <circle cx="260" cy="150" r="20"/>
    <circle cx="400" cy="150" r="20"/>
    <circle cx="220" cy="230" r="16"/>
    <circle cx="300" cy="230" r="16"/>
    <circle cx="440" cy="230" r="16" fill="#F6C343"/>
  </g>
  <!-- Grafo -->
  <g stroke="#FFFFFF" stroke-width="5" opacity="0.75">
    <line x1="560" y1="90" x2="680" y2="70"/>
    <line x1="680" y1="70" x2="740" y2="170"/>
    <line x1="560" y1="90" x2="610" y2="200"/>
    <line x1="610" y1="200" x2="740" y2="170"/>
    <line x1="560" y1="90" x2="740" y2="170"/>
  </g>
  <g fill="#1F3B73" stroke="#FFFFFF" stroke-width="5">
    <circle cx="560" cy="90" r="18"/>
    <circle cx="680" cy="70" r="18"/>
    <circle cx="740" cy="170" r="18"/>
    <circle cx="610" cy="200" r="18"/>
  </g>
</svg>
